name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.8'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -m 'not integration and not hardware and not diarization' --cov=polyvox --cov-report=xml
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml

  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64/v8
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python scripts/download_model.py nemotron-asr
      - run: python scripts/download_model.py nemotron-diar
      - run: docker build --platform ${{ matrix.platform }} -f dockerfile-cpu -t polyvox-server:test .
      - run: python scripts/container_smoke.py --image polyvox-server:test

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.8'
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: uv sync --locked
      - run: python scripts/install_runtime.py --device cpu --prefix .runtime/nemo
      - run: python scripts/download_model.py nemotron-asr
      - run: python scripts/download_model.py nemotron-diar
      - shell: bash
        env:
          RUN_INTEGRATION: '1'
          MODEL_PATH: models/nemotron-asr.gguf
          DIARIZATION_MODEL: models/nemotron-diar.gguf
          NEMO_RUNTIME_DIR: .runtime/nemo
        run: uv run --no-sync pytest -m integration
