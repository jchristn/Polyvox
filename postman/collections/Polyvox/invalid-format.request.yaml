$kind: http-request
order: 7000
method: POST
url: '{{base_url}}/transcribe?format=xml'
queryParams:
- key: format
  value: xml
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test("HTTP 400", () => pm.response.to.have.status(400));
    pm.test("Invalid format is explained", () => {
      pm.expect(pm.response.json().error).to.eql("format must be text, json, sse, or jsonl");
    });
