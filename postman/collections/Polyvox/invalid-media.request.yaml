$kind: http-request
order: 8000
method: POST
url: '{{base_url}}/transcribe?format=json'
body:
  type: formdata
  content:
  - key: file
    type: file
    src: openapi.yaml
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test("HTTP 422", () => pm.response.to.have.status(422));
    pm.test("Invalid media has a correlated error", () => {
      const body = pm.response.json();
      pm.expect(body.error).to.eql("invalid_media");
      pm.expect(body.detail).to.be.a("string");
      pm.expect(body.request_id).to.eql(pm.response.headers.get("X-Request-ID"));
    });
queryParams:
- key: format
  value: json
