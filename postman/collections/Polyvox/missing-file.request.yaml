$kind: http-request
order: 6000
method: POST
url: '{{base_url}}/transcribe'
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test("HTTP 400", () => pm.response.to.have.status(400));
    pm.test("Missing multipart file is explained", () => {
      pm.expect(pm.response.json().error).to.eql("Provide a file in the multipart 'file' field");
    });
