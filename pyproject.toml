[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "polyvox"
version = "1.0.0"
description = "Portable, isolated audio transcription with optional speaker diarization"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["flask==3.1.3", "waitress==3.0.2"]

[project.scripts]
polyvox = "polyvox.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "build==1.6.1",
    "pyyaml>=6.0.3,<7",
    "openapi-spec-validator>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["polyvox"]

[tool.hatch.build.targets.sdist]
exclude = ["/.runtime/**", "/.venv/**", "/models/**", "/dist/**", "/.postman/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires FFmpeg, the NeMo SDK and local models", "hardware: requires an explicitly selected accelerator", "diarization: requires the local Nemotron diarization model"]

[tool.ruff]
extend-exclude = [".runtime", "models"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["polyvox"]
patch = ["subprocess"]
